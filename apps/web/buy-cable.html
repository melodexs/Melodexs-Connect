<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="api-base-url" content="">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TV Subscription | MELODEXS CONNECT</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="api.js"></script>
    <script src="ui.js" defer></script>
    <meta name="theme-color" content="#0251B0">
    <link rel="manifest" href="/manifest.webmanifest">
    <script src="/pwa.js" defer></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/icons/melodexs-connect-192.png">
</head>

<body class="app-body">

<header class="appbar" id="appbar"></header>
<nav class="desktop-tabs" id="desktop-tabs" aria-label="Primary"></nav>

<main class="page page-narrow">

    <h1 class="fw-bold" style="font-size:22px">TV Subscription</h1>
    <p class="muted small">GOtv, Startimes and DStv packages, instantly</p>

    <div class="card mt-2">
        <div class="confirm-row"><span class="k">Wallet balance</span><span class="v" id="balance">₦0</span></div>
    </div>

    <div id="unavailable" class="card mt-2 hidden">
        <p class="fw-bold">Coming soon</p>
        <p class="muted small">TV subscriptions are being rolled out and are not live on your account yet. Your wallet is never charged.</p>
    </div>

    <div id="purchaseForm" class="card mt-2 hidden">
        <div class="field">
            <label for="operator">TV provider</label>
            <select id="operator"></select>
        </div>

        <div class="field mt-2">
            <label for="package">Package</label>
            <select id="package"></select>
        </div>

        <div class="field mt-2">
            <label for="smartcard">Smartcard number</label>
            <input id="smartcard" type="text" inputmode="numeric" placeholder="e.g. 01831333090" maxlength="15" autocomplete="off">
            <button class="btn btn-outline btn-sm mt-1" id="verifyCardBtn" type="button">Verify smartcard</button>
            <p class="small mt-1 hidden" id="cardCustomer"></p>
        </div>

        <div class="field mt-2">
            <label>Subscription type</label>
            <div class="chip-row" id="subTypes" role="group" aria-label="Subscription type"></div>
        </div>

        <div class="field mt-2">
            <label for="phone">Phone number</label>
            <input id="phone" type="tel" inputmode="numeric" placeholder="e.g. 08012345678" maxlength="14">
        </div>

        <div class="field">
            <label for="purchasePin">Purchase PIN</label>
            <input id="purchasePin" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN" autocomplete="off">
        </div>

        <div id="message" class="form-error hidden" role="alert"></div>

        <div class="confirm-row"><span class="k">Provider</span><span class="v" id="summaryOperator">Not selected</span></div>
        <div class="confirm-row"><span class="k">Package</span><span class="v" id="summaryPackage">Not selected</span></div>
        <div class="confirm-row"><span class="k">Customer</span><span class="v" id="summaryCustomer">Not verified</span></div>
        <div class="confirm-row"><span class="k">Amount payable</span><span class="v" id="summaryAmount">₦0</span></div>

        <button class="btn btn-primary btn-block btn-lg mt-2" id="buyButton" disabled>Choose a Package</button>
    </div>

</main>

<nav class="bottom-nav" id="bottom-nav" aria-label="Primary"></nav>

<script>
document.addEventListener("DOMContentLoaded", () => {
    window.MELODEXS_UI.mountChrome("plans");
    start();
});

let user;
let operators = [];
let selectedSubType = "renew";
let customerName = "";
let cableRequestId = "";
const ui = () => window.MELODEXS_UI;

async function start() {
    const session = await ui().requireSession();
    if (!session) return;
    user = ui().currentUser();
    if (!user) { window.location.href = "/login.html"; return; }

    await loadBalance();
    await loadOperators();

    renderSubTypes();
    document.getElementById("operator").addEventListener("change", renderPackages);
    document.getElementById("package").addEventListener("change", updateSummary);
    document.getElementById("smartcard").addEventListener("input", cardChanged);
    document.getElementById("verifyCardBtn").addEventListener("click", verifySmartcard);
    document.getElementById("purchasePin").addEventListener("input", function () { this.value = this.value.replace(/\D/g, "").slice(0, 4); });
    document.getElementById("buyButton").addEventListener("click", purchaseCable);
}

async function loadBalance() {
    try {
        const response = await fetch("/api/user/" + user.id, { credentials: "include" });
        const data = await response.json();
        if (data.success) {
            user = { ...data.user, has_purchase_pin: data.has_purchase_pin };
            localStorage.setItem("cheapdataUser", JSON.stringify(user));
            document.getElementById("balance").textContent = ui().formatNaira(user.balance);
        }
    } catch (error) { /* cached balance */ }
}

async function loadOperators() {
    try {
        const response = await fetch("/api/billers/cable", { credentials: "include" });
        if (response.status === 503) {
            document.getElementById("unavailable").classList.remove("hidden");
            return;
        }
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.message || "Could not load TV providers");
        operators = data.services || [];
        document.getElementById("operator").innerHTML =
            '<option value="">Choose your TV provider</option>' +
            operators.map(op => '<option value="' + op.id + '">' + ui().esc(op.name) + "</option>").join("");
        document.getElementById("purchaseForm").classList.remove("hidden");
    } catch (error) {
        document.getElementById("unavailable").classList.remove("hidden");
    }
}

function renderPackages() {
    const operatorId = Number(document.getElementById("operator").value);
    const operator = operators.find(op => op.id === operatorId);
    const select = document.getElementById("package");
    if (!operator) {
        select.innerHTML = '<option value="">Choose your TV provider first</option>';
        updateSummary();
        return;
    }
    select.innerHTML = '<option value="">Choose a package</option>' +
        operator.plans.map(pl => '<option value="' + String(pl.id) + '" data-amount="' + pl.amount + '">' +
            ui().esc(pl.name) + " · " + ui().formatNaira(pl.amount) + "</option>").join("");
    cardChanged();
    updateSummary();
}

function renderSubTypes() {
    const container = document.getElementById("subTypes");
    container.innerHTML = ["renew", "change"].map(t =>
        '<button type="button" class="chip ' + (t === selectedSubType ? "active" : "") + '" data-type="' + t + '">' +
        (t === "renew" ? "Renew current" : "Change package") + "</button>").join("");
    container.querySelectorAll(".chip").forEach(button =>
        button.addEventListener("click", () => {
            selectedSubType = button.dataset.type;
            container.querySelectorAll(".chip").forEach(b => b.classList.remove("active"));
            button.classList.add("active");
        }));
}

function cardChanged() {
    customerName = "";
    document.getElementById("cardCustomer").classList.add("hidden");
    updateSummary();
}

async function verifySmartcard() {
    const planId = document.getElementById("package").value;
    const smartcard = document.getElementById("smartcard").value.replace(/\D/g, "");
    if (!planId) { showMessage("Choose a package before verifying.", "error"); return; }
    if (smartcard.length < 5) { showMessage("Enter a valid smartcard number first.", "error"); return; }
    const button = document.getElementById("verifyCardBtn");
    button.disabled = true;
    button.textContent = "Verifying…";
    try {
        const response = await fetch("/api/billers/cable/verify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ plan_id: planId, smartcard: smartcard })
        });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.message || "Smartcard verification failed");
        customerName = data.customer_name || "Verified customer";
        const line = document.getElementById("cardCustomer");
        line.textContent = "✓ " + customerName;
        line.className = "small mt-1 form-success";
        updateSummary();
    } catch (error) {
        customerName = "";
        const line = document.getElementById("cardCustomer");
        line.textContent = "✗ " + (error.message || "Could not verify this smartcard.");
        line.className = "small mt-1 form-error";
        updateSummary();
    } finally {
        button.disabled = false;
        button.textContent = "Verify smartcard";
    }
}

function selectedPlan() {
    const planSelect = document.getElementById("package");
    const option = planSelect.options[planSelect.selectedIndex];
    if (!option || !option.value) return null;
    return { id: option.value, amount: Number(option.dataset.amount), name: option.text.split(" · ")[0] };
}

function updateSummary() {
    const plan = selectedPlan();
    const operatorSelect = document.getElementById("operator");
    const smartcard = document.getElementById("smartcard").value.replace(/\D/g, "");
    document.getElementById("summaryOperator").textContent = operatorSelect.options[operatorSelect.selectedIndex] ? ui().esc(operatorSelect.options[operatorSelect.selectedIndex].text) : "Not selected";
    document.getElementById("summaryPackage").textContent = plan ? plan.name : "Not selected";
    document.getElementById("summaryCustomer").textContent = customerName || "Not verified";
    document.getElementById("summaryAmount").textContent = plan ? ui().formatNaira(plan.amount) : "₦0";
    const buyButton = document.getElementById("buyButton");
    if (plan && smartcard.length >= 5) {
        buyButton.disabled = false;
        buyButton.textContent = "Pay " + ui().formatNaira(plan.amount);
    } else {
        buyButton.disabled = true;
        buyButton.textContent = "Choose a Package";
    }
}

function showMessage(text, type) {
    const message = document.getElementById("message");
    message.textContent = text;
    message.classList.remove("hidden");
    message.className = type === "success" ? "form-success" : "form-error";
    message.scrollIntoView({ behavior: "smooth", block: "center" });
    ui().toast(text, type === "success" ? "success" : "error");
}

async function purchaseCable() {
    const operatorId = Number(document.getElementById("operator").value);
    const plan = selectedPlan();
    const smartcard = document.getElementById("smartcard").value.replace(/\D/g, "");
    const phone = document.getElementById("phone").value.trim();
    const pin = document.getElementById("purchasePin").value.trim();
    const buyButton = document.getElementById("buyButton");
    document.getElementById("message").classList.add("hidden");

    if (!operatorId || !plan) { showMessage("Choose your TV provider and package.", "error"); return; }
    if (smartcard.length < 5) { showMessage("Enter a valid smartcard number.", "error"); return; }
    if (!/^0[7-9][0-1][0-9]{8}$/.test(phone)) { showMessage("Please enter a valid Nigerian phone number.", "error"); return; }
    if (!/^\d{4}$/.test(pin)) { showMessage("Please enter your 4-digit Purchase PIN.", "error"); return; }
    if (Number(user.balance) < plan.amount) { showMessage("Insufficient wallet balance. Top up your wallet first.", "error"); return; }

    const confirmed = await ui().confirm("Confirm TV subscription",
        "Pay " + ui().formatNaira(plan.amount) + " for " + plan.name + " on smartcard " + smartcard + "?", "Pay " + ui().formatNaira(plan.amount));
    if (!confirmed) return;

    buyButton.disabled = true;
    buyButton.textContent = "Processing…";
    if (!cableRequestId) cableRequestId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2);

    try {
        const response = await fetch("/api/purchase-cable", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({
                service_id: operatorId, plan_id: plan.id, smartcard: smartcard,
                phone_number: phone, customer_name: customerName,
                subscription_type: selectedSubType, expectedPrice: plan.amount,
                pin: pin, requestId: cableRequestId
            })
        });
        const data = await response.json();
        if (!response.ok || !data.success) {
            if (response.status === 202) {
                showMessage(data.message || "Your subscription is awaiting provider confirmation. Please do not retry it.", "error");
                buyButton.textContent = "Purchase Pending";
                return;
            }
            showMessage(data.message || "TV subscription failed.", "error");
            buyButton.disabled = false;
            cableRequestId = "";
            buyButton.textContent = "Pay " + ui().formatNaira(plan.amount);
            return;
        }
        showMessage("TV subscription successful! Reference: " + data.reference + ". Check your wallet history for the receipt.", "success");
        buyButton.textContent = "Purchase Submitted";
        cableRequestId = "";
        document.getElementById("purchasePin").value = "";
        loadBalance();
    } catch (error) {
        showMessage("Unable to connect to the server. If the purchase was submitted, it is being confirmed safely — check your wallet history before retrying.", "error");
        buyButton.disabled = false;
        buyButton.textContent = "Pay " + ui().formatNaira(plan.amount);
    }
}
</script>

</body>

</html>
