<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="api-base-url" content="">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Create Account | MELODEXS CONNECT</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0251B0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MELODEXS">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>

<body class="auth-body">
    <nav class="landing-nav" aria-label="Main">
        <a class="landing-logo" href="/"><span class="logo-mark">M</span>MELODEXS CONNECT</a>
        <a class="back-home" href="/">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to home
        </a>
    </nav>

    <header class="auth-hero">
        <h1>Create your <span class="auth-accent">MELODEXS CONNECT</span> account</h1>
        <p>Join and enjoy affordable data and airtime in minutes.</p>
    </header>

    <main class="auth-card" aria-labelledby="authTitle">
        <h2 class="form-label" id="authTitle">Register</h2>

        <form id="registerForm" novalidate>
            <label class="field">
                <span class="field-label">Full name</span>
                <input id="name" class="input" type="text" autocomplete="name" placeholder="Your full name" required>
            </label>
            <label class="field">
                <span class="field-label">Email address</span>
                <input id="email" class="input" type="email" autocomplete="email" placeholder="you@example.com" required>
            </label>
            <label class="field">
                <span class="field-label">Phone number</span>
                <input id="phone" class="input" type="tel" inputmode="tel" autocomplete="tel" placeholder="08012345678" required>
            </label>
            <label class="field">
                <span class="field-label">Password</span>
                <input id="password" class="input" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
            </label>
            <label class="field">
                <span class="field-label">Confirm password</span>
                <input id="confirmPassword" class="input" type="password" autocomplete="new-password" placeholder="Repeat your password" required>
            </label>
            <button type="submit" class="btn btn-primary btn-block" id="registerButton">Create Account</button>
        </form>

        <div id="googleAuthWrap" class="hidden">
            <div class="auth-divider" role="separator"><span>or</span></div>
            <div id="googleBtn" class="google-btn-wrap"></div>
        </div>

        <p class="message" id="message" role="status" aria-live="polite" hidden></p>

        <p class="auth-alt">
            Already have an account?
            <a href="/login.html">Sign in</a>
        </p>
    </main>

    <script src="api.js"></script>
    <script src="/pwa.js" defer></script>
    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const button = document.getElementById("registerButton");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
            message.hidden = false;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            message.hidden = true;

            if (!name) { showMessage("Please enter your full name.", "error"); return; }
            if (!email) { showMessage("Please enter your email address.", "error"); return; }
            if (!/^0[789][01][0-9]{8}$/.test(phone)) {
                showMessage("Please enter a valid Nigerian phone number.", "error");
                return;
            }
            if (password.length < 8) {
                showMessage("Password must be at least 8 characters.", "error");
                return;
            }
            if (password !== confirmPassword) {
                showMessage("Passwords do not match.", "error");
                return;
            }

            button.disabled = true;
            button.textContent = "Creating Account…";
            try {
                const response = await fetch("/api/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ name: name, email: email, phone: phone, password: password })
                });
                let data;
                try {
                    data = await response.json();
                } catch (jsonError) {
                    throw new Error("The server returned an invalid response.");
                }
                if (!response.ok || !data.success) {
                    showMessage(data.message || "Registration failed.", "error");
                    button.disabled = false;
                    button.textContent = "Create Account";
                    return;
                }
                if (!data.user || !data.user.id) {
                    showMessage("Account was created, but no user ID was returned.", "error");
                    button.disabled = false;
                    button.textContent = "Create Account";
                    return;
                }
                localStorage.setItem("cheapdataNewUserId", String(data.user.id));
                showMessage("Account created successfully! Setting up your PIN…", "success");
                button.textContent = "Account Created ✓";
                // Send the new user to set up their Purchase PIN.
                setTimeout(function () {
                    window.location.href = "/purchase-pin.html";
                }, 900);
            } catch (error) {
                showMessage(error.message || "Unable to register. Please try again.", "error");
                button.disabled = false;
                button.textContent = "Create Account";
            }
        });
    
        // ---- Continue with Google -----------------------------------------
        // The button only renders when the API reports a configured Google
        // client ID; otherwise this section stays hidden.
        async function handleGoogleCredential(credential) {
            try {
                const response = await fetch("/api/auth/google", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ credential: credential })
                });
                let data;
                try { data = await response.json(); } catch (jsonError) {
                    throw new Error("The server returned an invalid response. Please try again in a moment.");
                }
                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Google sign-in failed. Please try again.");
                }
                if (data.user && data.user.id) {
                    localStorage.setItem("cheapdataNewUserId", String(data.user.id));
                }
                showMessage("Account created with Google! Setting up your PIN…", "success");
                setTimeout(function () {
                    window.location.href = "/purchase-pin.html";
                }, 900);
            } catch (error) {
                showMessage(error.message || "Google sign-in failed. Please try again.", "error");
            }
}
        async function setupGoogleAuth() {
            try {
                const response = await fetch("/api/auth/google/config", { headers: { "Accept": "application/json" }, credentials: "include" });
                const config = await response.json();
                if (!config.success || !config.enabled || !config.client_id) return;
                const script = document.createElement("script");
                script.src = "https://accounts.google.com/gsi/client";
                script.async = true;
                script.defer = true;
                script.onload = function () {
                    window.google.accounts.id.initialize({
                        client_id: config.client_id,
                        callback: function (googleResponse) {
                            if (googleResponse && googleResponse.credential) {
                                handleGoogleCredential(googleResponse.credential);
                            }
                        }
                    });
                    window.google.accounts.id.renderButton(
                        document.getElementById("googleBtn"),
                        { theme: "outline", size: "large", shape: "pill", text: "continue_with", logo_alignment: "left", width: 300 }
                    );
                    document.getElementById("googleAuthWrap").classList.remove("hidden");
                };
                document.head.appendChild(script);
            } catch (error) { /* stay hidden on any config failure */ }
        }
        document.addEventListener("DOMContentLoaded", setupGoogleAuth);
    </script>
</body>

</html>
