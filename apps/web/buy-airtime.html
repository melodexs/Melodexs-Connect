<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="api-base-url" content="">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Buy Airtime | MELODEXS CONNECT</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="api.js"></script>
    <script src="ui.js" defer></script>
    <meta name="theme-color" content="#0251B0">
    <link rel="manifest" href="/manifest.webmanifest">
    <script src="/pwa.js" defer></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/icons/melodexs-connect-192.png">
</head>

<body>

<header class="appbar" id="appbar"></header>
<nav class="desktop-tabs" id="desktop-tabs" aria-label="Primary"></nav>

<main class="page page-narrow">

    <h1 class="fw-bold" style="font-size:22px">Buy Airtime</h1>
    <p class="muted small">Instant airtime top-up for any network</p>

    <div class="card mt-2">
        <div class="confirm-row"><span class="k">Wallet balance</span><span class="v" id="balance">₦0</span></div>
    </div>

    <div class="card mt-2">
        <div class="field">
            <label for="phone">Recipient phone number</label>
            <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="e.g. 08012345678" maxlength="14">
        </div>
        <div id="favoritesRow" class="hidden">
            <label class="small fw-bold muted">Saved recipients</label>
            <div class="chip-row mt-1" id="favoritesList"></div>
        </div>

        <div class="field mt-2">
            <label>Network</label>
            <div class="chip-row" id="networks" role="group" aria-label="Network"></div>
        </div>

        <div class="field mt-2">
            <label for="amount">Amount (₦50 – ₦50,000)</label>
            <div class="amount-grid" id="amountGrid" role="group" aria-label="Quick amounts"></div>
            <input id="amount" type="number" inputmode="numeric" min="50" max="50000" step="1" placeholder="Custom amount" class="mt-2" style="width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15px">
        </div>

        <div class="field">
            <label for="purchasePin">Purchase PIN</label>
            <input id="purchasePin" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN" autocomplete="off">
        </div>

        <div id="message" class="form-error hidden" role="alert"></div>

        <div class="confirm-row"><span class="k">Recipient</span><span class="v" id="summaryPhone">Not entered</span></div>
        <div class="confirm-row"><span class="k">Network</span><span class="v" id="summaryNetwork">MTN</span></div>
        <div class="confirm-row"><span class="k">Amount payable</span><span class="v" id="summaryAmount">₦0</span></div>

        <button class="btn btn-primary btn-block btn-lg mt-2" id="buyButton" disabled>Enter Airtime Amount</button>
        <button class="btn btn-ghost btn-sm mt-2" id="saveFavoriteBtn" type="button">☆ Save this number</button>
    </div>

</main>

<div class="modal-backdrop" id="confirm-modal" role="dialog" aria-modal="true"></div>

<nav class="bottom-nav" id="bottom-nav" aria-label="Primary"></nav>

<script>
document.addEventListener("DOMContentLoaded", () => {
    window.MELODEXS_UI.mountChrome("plans");
    start();
});

let user;
let selectedNetwork = "MTN";
let airtimeRequestId = "";
let myFavorites = [];
const ui = () => window.MELODEXS_UI;
const QUICK_AMOUNTS = [100, 200, 500, 1000, 2000, 5000];

async function start() {
    const session = await ui().requireSession();
    if (!session) return;
    user = ui().currentUser();
    if (!user) { window.location.href = "/login.html"; return; }

    await loadBalance();
    await loadFavorites();

    renderNetworks();
    const grid = document.getElementById("amountGrid");
    grid.innerHTML = QUICK_AMOUNTS.map(a => '<button type="button" class="amount-btn" data-amount="' + a + '">₦' + a.toLocaleString() + "</button>").join("");
    grid.querySelectorAll(".amount-btn").forEach(button =>
        button.addEventListener("click", () => {
            grid.querySelectorAll(".amount-btn").forEach(b => b.classList.remove("active"));
            button.classList.add("active");
            document.getElementById("amount").value = button.dataset.amount;
            updateSummary();
        }));

    document.getElementById("phone").addEventListener("input", updateSummary);
    document.getElementById("amount").addEventListener("input", () => {
        document.querySelectorAll(".amount-btn").forEach(b => b.classList.remove("active"));
        updateSummary();
    });
    document.getElementById("purchasePin").addEventListener("input", function () { this.value = this.value.replace(/\D/g, "").slice(0, 4); });
    document.getElementById("buyButton").addEventListener("click", purchaseAirtime);
    document.getElementById("saveFavoriteBtn").addEventListener("click", saveFavorite);
}

async function loadBalance() {
    try {
        const response = await fetch("/api/user/" + user.id, { credentials: "include" });
        const data = await response.json();
        if (data.success) {
            user = { ...data.user, has_purchase_pin: data.has_purchase_pin };
            localStorage.setItem("cheapdataUser", JSON.stringify(user));
            document.getElementById("balance").textContent = ui().formatNaira(user.balance);
        }
    } catch (error) { /* cached balance */ }
}

function renderNetworks() {
    const container = document.getElementById("networks");
    container.innerHTML = ui().NETWORKS.map(n =>
        '<button type="button" class="chip network ' + (n.slug === selectedNetwork ? "active" : "") + '" data-network="' + n.slug + '">' +
        '<span class="chip-dot" style="background:' + n.color + '"></span>' + n.slug + "</button>").join("");
    container.querySelectorAll(".network").forEach(button =>
        button.addEventListener("click", () => {
            selectedNetwork = button.dataset.network;
            container.querySelectorAll(".network").forEach(b => b.classList.remove("active"));
            button.classList.add("active");
            document.getElementById("summaryNetwork").textContent = selectedNetwork;
        }));
}

async function loadFavorites() {
    try {
        const response = await fetch("/api/favorites", { credentials: "include" });
        const data = await response.json();
        if (!data.success) return;
        myFavorites = data.favorites || [];
        renderFavorites();
    } catch (error) { /* optional */ }
}

function renderFavorites() {
    const row = document.getElementById("favoritesRow");
    const list = document.getElementById("favoritesList");
    if (!myFavorites.length) { row.classList.add("hidden"); return; }
    row.classList.remove("hidden");
    list.innerHTML = "";
    myFavorites.forEach(fav => {
        const wrap = document.createElement("span");
        wrap.className = "chip-wrap";
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.innerHTML = '<span aria-hidden="true">★</span> ' + ui().esc(fav.label || fav.phone);
        chip.title = fav.network ? fav.network + " · " + fav.phone : fav.phone;
        chip.addEventListener("click", () => {
            document.getElementById("phone").value = fav.phone;
            if (fav.network && fav.network !== selectedNetwork) {
                const btn = document.querySelector('.network[data-network="' + fav.network + '"]');
                if (btn) btn.click();
            }
            updateSummary();
            ui().toast("Recipient filled. Review and confirm your purchase.", "info");
        });
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "chip-remove";
        remove.setAttribute("aria-label", "Remove " + (fav.label || fav.phone) + " from favorites");
        remove.innerHTML = "&#10005;";
        remove.addEventListener("click", async () => {
            const confirmed = await ui().confirm("Remove favorite?", (fav.label || fav.phone) + " will be removed from your saved recipients.", "Remove");
            if (!confirmed) return;
            try {
                const response = await fetch("/api/favorites/" + fav.id, { method: "DELETE", credentials: "include" });
                if (!response.ok) throw new Error();
                ui().toast("Favorite removed.", "success");
                await loadFavorites();
            } catch (error) {
                ui().toast("Could not remove this favorite.", "error");
            }
        });
        wrap.appendChild(chip);
        wrap.appendChild(remove);
        list.appendChild(wrap);
    });
}

async function saveFavorite() {
    const phone = document.getElementById("phone").value.trim();
    if (!/^0[7-9][0-1][0-9]{8}$/.test(phone)) { showMessage("Enter a valid recipient number before saving it.", "error"); return; }
    try {
        const response = await fetch("/api/favorites", {
            method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include",
            body: JSON.stringify({ phone: phone, network: selectedNetwork, label: "" })
        });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.message || "Could not save");
        ui().toast("Recipient saved.", "success");
        await loadFavorites();
    } catch (error) {
        ui().toast(error.message || "Could not save this recipient.", "error");
    }
}

function updateSummary() {
    const phone = document.getElementById("phone").value;
    const amount = Number(document.getElementById("amount").value);
    document.getElementById("summaryPhone").textContent = phone || "Not entered";
    document.getElementById("summaryAmount").textContent = amount ? ui().formatNaira(amount) : "₦0";
    const buyButton = document.getElementById("buyButton");
    if (amount >= 50 && amount <= 50000) {
        buyButton.disabled = false;
        buyButton.textContent = "Buy Airtime for " + ui().formatNaira(amount);
    } else {
        buyButton.disabled = true;
        buyButton.textContent = "Enter Airtime Amount";
    }
}

function showMessage(text, type) {
    const message = document.getElementById("message");
    message.textContent = text;
    message.classList.remove("hidden");
    message.className = type === "success" ? "form-success" : "form-error";
    message.scrollIntoView({ behavior: "smooth", block: "center" });
    ui().toast(text, type === "success" ? "success" : "error");
}

async function purchaseAirtime() {
    const phone = document.getElementById("phone").value.trim();
    const amount = Number(document.getElementById("amount").value);
    const pin = document.getElementById("purchasePin").value.trim();
    const buyButton = document.getElementById("buyButton");
    document.getElementById("message").classList.add("hidden");

    if (!/^0[7-9][0-1][0-9]{8}$/.test(phone)) { showMessage("Please enter a valid Nigerian phone number.", "error"); return; }
    if (!Number.isFinite(amount) || amount < 50 || amount > 50000) { showMessage("Airtime amount must be between ₦50 and ₦50,000.", "error"); return; }
    if (!/^\d{4}$/.test(pin)) { showMessage("Please enter your 4-digit Purchase PIN.", "error"); return; }
    if (Number(user.balance) < amount) { showMessage("Insufficient wallet balance. Top up your wallet first.", "error"); return; }

    const confirmed = await ui().confirm("Confirm airtime purchase", "Buy " + ui().formatNaira(amount) + " " + selectedNetwork + " airtime for " + phone + "?", "Pay " + ui().formatNaira(amount));
    if (!confirmed) return;

    buyButton.disabled = true;
    buyButton.textContent = "Processing…";
    if (!airtimeRequestId) airtimeRequestId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2);

    try {
        const response = await fetch("/api/purchase-airtime", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ network: selectedNetwork, phone: phone, amount: amount, pin: pin, requestId: airtimeRequestId })
        });
        const data = await response.json();
        if (!response.ok || !data.success) {
            if (response.status === 202) {
                showMessage(data.message || "Purchase is awaiting provider confirmation. Please do not retry it.", "error");
                buyButton.textContent = "Purchase Pending";
                return;
            }
            showMessage(data.message || "Airtime purchase failed.", "error");
            buyButton.disabled = false;
            airtimeRequestId = "";
            buyButton.textContent = "Buy Airtime for " + ui().formatNaira(amount);
            return;
        }
        user.balance = data.balance;
        localStorage.setItem("cheapdataUser", JSON.stringify(user));
        document.getElementById("balance").textContent = ui().formatNaira(data.balance);
        showMessage("Airtime purchase successful! " + data.network + " airtime of " + ui().formatNaira(data.amount) + " sent to " + data.phone + ". Reference: " + data.reference, "success");
        buyButton.textContent = "Purchase Successful";
        airtimeRequestId = "";
        document.getElementById("purchasePin").value = "";
        ui().toast("Airtime sent to " + data.phone, "success");
    } catch (error) {
        showMessage("Unable to connect to the server. Please try again. If the purchase was submitted, it is being confirmed safely — check your wallet history before retrying.", "error");
        buyButton.disabled = false;
        buyButton.textContent = "Buy Airtime for " + ui().formatNaira(amount);
    }
}
</script>

</body>

</html>
