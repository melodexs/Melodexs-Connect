<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="api-base-url" content="">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Forgot Password | MELODEXS CONNECT</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0251B0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MELODEXS">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>

<body class="auth-body">
    <nav class="landing-nav" aria-label="Main">
        <a class="landing-logo" href="/"><span class="logo-mark">M</span>MELODEXS CONNECT</a>
    </nav>

    <header class="auth-hero">
        <h1>Reset your <span class="auth-accent">password</span></h1>
        <p>Enter your account email and we'll send reset instructions.</p>
    </header>

    <main class="auth-card" aria-labelledby="authTitle">
        <h2 class="form-label" id="authTitle">Forgot password</h2>

        <form id="forgotPasswordForm" novalidate>
            <label class="field">
                <span class="field-label">Email address</span>
                <input id="email" class="input" type="email" autocomplete="email" placeholder="you@example.com" required>
            </label>
            <button type="submit" class="btn btn-primary btn-block" id="submitButton">Send Reset Instructions</button>
        </form>

        <p class="message" id="message" role="status" aria-live="polite" hidden></p>

        <p class="auth-alt">
            Remembered it?
            <a href="/login.html">Back to login</a>
        </p>
    </main>

    <script src="api.js"></script>
    <script src="/pwa.js" defer></script>
    <script>
        const form = document.getElementById("forgotPasswordForm");
        const emailInput = document.getElementById("email");
        const submitButton = document.getElementById("submitButton");
        const message = document.getElementById("message");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
            message.hidden = false;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            const email = emailInput.value.trim();
            message.hidden = true;
            submitButton.disabled = true;
            submitButton.textContent = "Sending…";
            try {
                const response = await fetch("/api/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ email: email })
                });
                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Unable to process request.");
                }
                showMessage(data.message || "If an account exists with that email, password reset instructions will be provided.", "success");
                emailInput.value = "";
            } catch (error) {
                showMessage(error.message || "Something went wrong. Please try again.", "error");
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Send Reset Instructions";
            }
        });
    </script>
</body>

</html>
