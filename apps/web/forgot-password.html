<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - MELODEXS CONNECT</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #F5F8FC;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: white;
            padding: 18px 7%;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            color: #0251B0;
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #111827;
            margin-bottom: 12px;
        }

        .description {
            text-align: center;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #0251B0;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0251B0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0251B0;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .success {
            display: block;
            background: #EAF8C7;
            color: #0251B0;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #b91c1c;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #0251B0;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        .security-note {
            margin-top: 20px;
            padding: 12px;
            background: #f3f4f6;
            border-radius: 8px;
            color: #6b7280;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
        }

        footer {
            margin-top: auto;
            background: #111827;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .container {
                margin: 35px auto;
            }

            .card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="/" class="logo" aria-label="MELODEXS CONNECT">
        <span class="logo-main">MELODEXS</span>
        <span class="logo-connect">CONNECT</span>
    </a>
    </header>

    <main class="container">

        <div class="card">

            <h1>Forgot Password?</h1>

            <p class="description">
                Enter the email address connected to your MELODEXS CONNECT account.
                We'll help you reset your password.
            </p>

            <form id="forgotPasswordForm">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >

                <button type="submit" id="submitButton">
                    Send Reset Instructions
                </button>

            </form>

            <div id="message" class="message"></div>

            <div class="security-note">
                For your security, we won't reveal whether an email
                is registered on MELODEXS CONNECT.
            </div>

            <a href="/login.html" class="back-login">
                ← Back to Login
            </a>

        </div>

    </main>

    <footer>
        © 2026 MELODEXS CONNECT. All rights reserved.
    </footer>

    <script>
        const form = document.getElementById("forgotPasswordForm");
        const emailInput = document.getElementById("email");
        const submitButton = document.getElementById("submitButton");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = emailInput.value.trim();

            message.style.display = "none";
            message.className = "message";

            submitButton.disabled = true;
            submitButton.textContent = "Sending...";

            try {
                const response = await fetch("/api/forgot-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(
                        data.message || "Unable to process request."
                    );
                }

                message.textContent =
                    data.message ||
                    "If an account exists with that email, password reset instructions will be provided.";

                message.classList.add("success");
                message.style.display = "block";

                emailInput.value = "";

            } catch (error) {

                message.textContent =
                    error.message ||
                    "Something went wrong. Please try again.";

                message.classList.add("error");
                message.style.display = "block";

            } finally {

                submitButton.disabled = false;
                submitButton.textContent = "Send Reset Instructions";
            }
        });
    </script>

</body>
</html>
