<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="api-base-url" content="">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login | MELODEXS CONNECT</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0251B0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MELODEXS">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>

<body class="auth-body">
    <nav class="landing-nav" aria-label="Main">
        <a class="landing-logo" href="/"><span class="logo-mark">M</span>MELODEXS CONNECT</a>
        <a class="back-home" href="/">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to home
        </a>
    </nav>

    <header class="auth-hero">
        <h1>Welcome back to <span class="auth-accent">MELODEXS CONNECT</span></h1>
        <p>Sign in to buy affordable data, airtime and more.</p>
    </header>

    <main class="auth-card" aria-labelledby="authTitle">
        <h2 class="form-label" id="authTitle">Sign in to your account</h2>

        <form id="loginForm" novalidate>
            <label class="field">
                <span class="field-label">Email address</span>
                <input id="email" class="input" type="email" autocomplete="email" placeholder="you@example.com" required>
            </label>
            <label class="field">
                <span class="field-label">Password</span>
                <input id="password" class="input" type="password" autocomplete="current-password" placeholder="Your password" required>
            </label>
            <button type="submit" class="btn btn-primary btn-block" id="loginButton">Login</button>
        </form>

        <p class="message" id="message" role="status" aria-live="polite" hidden></p>

        <p class="auth-alt">
            <a href="/forgot-password.html">Forgot password?</a>
        </p>
        <p class="auth-alt">
            New to MELODEXS CONNECT?
            <a href="/register.html">Create an account</a>
        </p>
    </main>

    <script src="api.js"></script>
    <script src="/pwa.js" defer></script>
    <script>
        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
            message.hidden = false;
        }

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();
            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            message.hidden = true;
            message.textContent = "";
            loginButton.disabled = true;
            loginButton.textContent = "Signing in…";
            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ email: email, password: password })
                });
                // Read as text first so a non-JSON response never breaks parsing.
                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (jsonError) {
                    throw new Error("The server returned an invalid response. Please try again in a moment.");
                }
                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Invalid email or password.");
                }
                if (data.user) {
                    localStorage.setItem("cheapdataUser", JSON.stringify(data.user));
                    if (data.user.id) {
                        localStorage.setItem("cheapdataUserId", String(data.user.id));
                    }
                }
                showMessage("Login successful! Redirecting…", "success");
                // Give the session cookie a moment before redirecting.
                setTimeout(function () {
                    window.location.href = "/dashboard.html";
                }, 700);
            } catch (error) {
                showMessage(error.message || "Unable to login. Please try again.", "error");
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    </script>
</body>

</html>
