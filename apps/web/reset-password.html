<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password - MELODEXS CONNECT</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #F5F8FC;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    header {
        background: white;
        padding: 18px 7%;
        border-bottom: 1px solid #e5e7eb;
    }

    .logo {
        color: #0251B0;
        font-size: 25px;
        font-weight: bold;
        text-decoration: none;
    }

    .container {
        width: 100%;
        max-width: 450px;
        margin: 60px auto;
        padding: 0 20px;
    }

    .card {
        background: white;
        padding: 35px;
        border-radius: 14px;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
        text-align: center;
        color: #111827;
        margin-bottom: 12px;
    }

    .description {
        text-align: center;
        color: #6b7280;
        line-height: 1.6;
        margin-bottom: 28px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #374151;
    }

    input {
        width: 100%;
        padding: 13px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        margin-bottom: 18px;
    }

    input:focus {
        border-color: #0251B0;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #0251B0;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #0251B0;
    }

    button:disabled {
        background: #9ca3af;
        cursor: not-allowed;
    }

    .message {
        display: none;
        margin-top: 18px;
        padding: 13px;
        border-radius: 8px;
        text-align: center;
        font-size: 14px;
        line-height: 1.5;
    }

    .success {
        display: block;
        background: #EAF8C7;
        color: #0251B0;
    }

    .error {
        display: block;
        background: #fee2e2;
        color: #b91c1c;
    }

    .back-login {
        display: block;
        text-align: center;
        margin-top: 25px;
        color: #0251B0;
        text-decoration: none;
        font-weight: bold;
        font-size: 14px;
    }

    .back-login:hover {
        text-decoration: underline;
    }

    .password-rules {
        color: #6b7280;
        font-size: 13px;
        margin-top: -8px;
        margin-bottom: 18px;
    }

    footer {
        margin-top: auto;
        background: #111827;
        color: white;
        text-align: center;
        padding: 20px;
        font-size: 14px;
    }

    @media (max-width: 500px) {
        .container {
            margin: 35px auto;
        }

        .card {
            padding: 25px 20px;
        }
    }
</style>

</head>

<body>

<header>
    <a href="/" class="logo" aria-label="MELODEXS CONNECT">
        <span class="logo-main">MELODEXS</span>
        <span class="logo-connect">CONNECT</span>
    </a>
</header>

<main class="container">

    <div class="card">

        <h1>Reset Password</h1>

        <p class="description">
            Create a new password for your MELODEXS CONNECT account.
        </p>

        <form id="resetPasswordForm">

            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                name="newPassword"
                placeholder="Enter your new password"
                minlength="8"
                required
            >

            <p class="password-rules">
                Password must be at least 8 characters.
            </p>

            <label for="confirmPassword">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Enter your new password again"
                minlength="8"
                required
            >

            <button
                type="submit"
                id="submitButton"
            >
                Reset Password
            </button>

        </form>

        <div
            id="message"
            class="message"
        ></div>

        <a
            href="/login.html"
            class="back-login"
        >
            ← Back to Login
        </a>

    </div>

</main>

<footer>
    © 2026 MELODEXS CONNECT. All rights reserved.
</footer>


<script>

    const form =
        document.getElementById(
            "resetPasswordForm"
        );

    const newPassword =
        document.getElementById(
            "newPassword"
        );

    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        );

    const submitButton =
        document.getElementById(
            "submitButton"
        );

    const message =
        document.getElementById(
            "message"
        );


    // Get reset token from URL
    const urlParams =
        new URLSearchParams(
            window.location.search
        );

    const token =
        urlParams.get("token");


    // Check whether token exists
    if (!token) {

        message.textContent =
            "This password reset link is invalid or incomplete.";

        message.classList.add(
            "error"
        );

        message.style.display =
            "block";

        submitButton.disabled =
            true;
    }


    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            if (!token) {
                return;
            }


            const password =
                newPassword.value;

            const confirmation =
                confirmPassword.value;


            // Password length
            if (
                password.length < 8
            ) {

                message.textContent =
                    "Password must be at least 8 characters.";

                message.className =
                    "message error";

                message.style.display =
                    "block";

                return;
            }


            // Password match
            if (
                password !==
                confirmation
            ) {

                message.textContent =
                    "The passwords do not match.";

                message.className =
                    "message error";

                message.style.display =
                    "block";

                return;
            }


            message.style.display =
                "none";

            submitButton.disabled =
                true;

            submitButton.textContent =
                "Resetting...";


            try {

                const response =
                    await fetch(
                        "/api/reset-password",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    token:
                                        token,

                                    newPassword:
                                        password
                                })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Unable to reset password."
                    );
                }


                message.textContent =
                    data.message ||
                    "Password reset successfully.";

                message.className =
                    "message success";

                message.style.display =
                    "block";


                form.reset();


                submitButton.textContent =
                    "Password Reset";


                submitButton.disabled =
                    true;


                // Send user to login
                // after a short delay
                setTimeout(
                    function () {

                        window.location.href =
                            "/login.html";

                    },
                    2500
                );


            } catch (error) {

                message.textContent =
                    error.message ||
                    "Something went wrong. Please try again.";

                message.className =
                    "message error";

                message.style.display =
                    "block";

                submitButton.disabled =
                    false;

                submitButton.textContent =
                    "Reset Password";
            }

        }
    );

</script>

</body>
</html>
