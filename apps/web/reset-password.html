<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="api-base-url" content="">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Set New Password | MELODEXS CONNECT</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0251B0">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>

<body class="auth-body">
    <nav class="landing-nav" aria-label="Main">
        <a class="landing-logo" href="/"><span class="logo-mark">M</span>MELODEXS CONNECT</a>
    </nav>

    <header class="auth-hero">
        <h1>Choose a <span class="auth-accent">new password</span></h1>
        <p>Pick a strong password of at least 8 characters.</p>
    </header>

    <main class="auth-card" aria-labelledby="authTitle">
        <h2 class="form-label" id="authTitle">Set a new password</h2>

        <form id="resetPasswordForm" novalidate>
            <label class="field">
                <span class="field-label">New password</span>
                <input id="newPassword" class="input" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
            </label>
            <label class="field">
                <span class="field-label">Confirm new password</span>
                <input id="confirmPassword" class="input" type="password" autocomplete="new-password" placeholder="Repeat your new password" required>
            </label>
            <button type="submit" class="btn btn-primary btn-block" id="submitButton">Reset Password</button>
        </form>

        <p class="message" id="message" role="status" aria-live="polite" hidden></p>

        <p class="auth-alt">
            <a href="/login.html">Back to login</a>
        </p>
    </main>

    <script src="api.js"></script>
    <script src="/pwa.js" defer></script>
    <script>
        const form = document.getElementById("resetPasswordForm");
        const newPassword = document.getElementById("newPassword");
        const confirmPassword = document.getElementById("confirmPassword");
        const submitButton = document.getElementById("submitButton");
        const message = document.getElementById("message");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
            message.hidden = false;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");
        if (!token) {
            showMessage("This password reset link is invalid or incomplete.", "error");
            submitButton.disabled = true;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            if (!token) { return; }
            const password = newPassword.value;
            const confirmation = confirmPassword.value;
            if (password.length < 8) {
                showMessage("Password must be at least 8 characters.", "error");
                return;
            }
            if (password !== confirmation) {
                showMessage("The passwords do not match.", "error");
                return;
            }
            message.hidden = true;
            submitButton.disabled = true;
            submitButton.textContent = "Resetting…";
            try {
                const response = await fetch("/api/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ token: token, newPassword: password })
                });
                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Unable to reset your password.");
                }
                showMessage("Password reset successfully! Redirecting you to login…", "success");
                setTimeout(function () {
                    window.location.href = "/login.html";
                }, 1500);
            } catch (error) {
                showMessage(error.message || "Something went wrong. Please try again.", "error");
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Reset Password";
            }
        });
    </script>
</body>

</html>
