<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Purchase PIN - MELODEXS CONNECT</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #F5F8FC;
            color: #222;
            min-height: 100vh;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            font-size: 20px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .icon {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #eef2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .section {
            margin-bottom: 25px;
        }

        .section h3 {
            margin-bottom: 15px;
            font-size: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 18px;
            outline: none;
            margin-bottom: 15px;
        }

        input:focus {
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .success {
            background: #EAF8C7;
            color: #0251B0;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .hidden {
            display: none;
        }

        .logout {
            background: #dc2626;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
            }

            .card {
                padding: 22px;
            }
        }
    </style>
    <script src="api.js"></script>
</head>

<body>

<header>
    <h2>MELODEXS CONNECT</h2>
    <a href="dashboard.html" class="back-btn">← Dashboard</a>
</header>

<div class="container">

    <div class="card">

        <div class="icon">🔐</div>

        <h1>Purchase PIN</h1>

        <p class="subtitle">
            Your Purchase PIN helps protect your data and airtime purchases.
        </p>

        <div id="message" class="message"></div>

        <!-- SET PIN -->

        <div id="setSection" class="section">

            <h3>Create Purchase PIN</h3>

            <label for="newPin">
                Create 4-digit PIN
            </label>

            <input
                type="password"
                id="newPin"
                inputmode="numeric"
                maxlength="4"
                placeholder="••••"
                autocomplete="off"
            >

            <label for="confirmPin">
                Confirm PIN
            </label>

            <input
                type="password"
                id="confirmPin"
                inputmode="numeric"
                maxlength="4"
                placeholder="••••"
                autocomplete="off"
            >

            <button id="setButton" onclick="setPin()">
                Create Purchase PIN
            </button>

        </div>

        <!-- CHANGE PIN -->

        <div id="changeSection" class="section hidden">

            <h3>Change Purchase PIN</h3>

            <label for="currentPin">
                Current PIN
            </label>

            <input
                type="password"
                id="currentPin"
                inputmode="numeric"
                maxlength="4"
                placeholder="••••"
                autocomplete="off"
            >

            <label for="changeNewPin">
                New PIN
            </label>

            <input
                type="password"
                id="changeNewPin"
                inputmode="numeric"
                maxlength="4"
                placeholder="••••"
                autocomplete="off"
            >

            <label for="changeConfirmPin">
                Confirm New PIN
            </label>

            <input
                type="password"
                id="changeConfirmPin"
                inputmode="numeric"
                maxlength="4"
                placeholder="••••"
                autocomplete="off"
            >

            <button id="changeButton" onclick="changePin()">
                Change Purchase PIN
            </button>

        </div>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>

</div>

<script>

    const storedUser = localStorage.getItem("cheapdataUser");

    if (!storedUser) {
        window.location.href = "login.html";
    }

    const user = JSON.parse(storedUser);

    function showMessage(message, type) {

        const messageBox =
            document.getElementById("message");

        messageBox.textContent = message;

        messageBox.className =
            "message " + type;

        messageBox.style.display = "block";
    }

    function clearMessage() {

        const messageBox =
            document.getElementById("message");

        messageBox.style.display = "none";
    }

    async function loadUser() {

        try {

            const response = await fetch(
                `/api/user/${user.id}`
            );

            const data = await response.json();

            if (!data.success) {
                showMessage(
                    "Could not load your account.",
                    "error"
                );
                return;
            }

            const freshUser = data.user;

            localStorage.setItem(
                "cheapdataUser",
                JSON.stringify(freshUser)
            );

            if (data.has_purchase_pin) {
                document
                    .getElementById("setSection")
                    .classList.add("hidden");

                document
                    .getElementById("changeSection")
                    .classList.remove("hidden");
            }

        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to connect to MELODEXS CONNECT.",
                "error"
            );
        }
    }

    async function setPin() {

        clearMessage();

        const newPin =
            document.getElementById("newPin").value;

        const confirmPin =
            document.getElementById("confirmPin").value;

        if (!/^\d{4}$/.test(newPin)) {
            showMessage(
                "PIN must be exactly 4 digits.",
                "error"
            );
            return;
        }

        if (newPin !== confirmPin) {
            showMessage(
                "PINs do not match.",
                "error"
            );
            return;
        }

        const button =
            document.getElementById("setButton");

        button.disabled = true;
        button.textContent = "Creating...";

        try {

            const response = await fetch(
                "/api/purchase-pin/set",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        pin: newPin
                    })
                }
            );

            const data =
                await response.json();

            if (!data.success) {
                showMessage(
                    data.message,
                    "error"
                );

                button.disabled = false;
                button.textContent =
                    "Create Purchase PIN";

                return;
            }

            showMessage(
                "Purchase PIN created successfully!",
                "success"
            );

            document
                .getElementById("setSection")
                .classList.add("hidden");

            document
                .getElementById("changeSection")
                .classList.remove("hidden");

        } catch (error) {

            console.error(error);

            showMessage(
                "Something went wrong. Please try again.",
                "error"
            );

            button.disabled = false;
            button.textContent =
                "Create Purchase PIN";
        }
    }

    async function changePin() {

        clearMessage();

        const currentPin =
            document.getElementById("currentPin").value;

        const newPin =
            document.getElementById("changeNewPin").value;

        const confirmPin =
            document.getElementById("changeConfirmPin").value;

        if (!/^\d{4}$/.test(currentPin)) {
            showMessage(
                "Current PIN must be exactly 4 digits.",
                "error"
            );
            return;
        }

        if (!/^\d{4}$/.test(newPin)) {
            showMessage(
                "New PIN must be exactly 4 digits.",
                "error"
            );
            return;
        }

        if (newPin !== confirmPin) {
            showMessage(
                "New PINs do not match.",
                "error"
            );
            return;
        }

        const button =
            document.getElementById("changeButton");

        button.disabled = true;
        button.textContent = "Changing...";

        try {

            const response = await fetch(
                "/api/purchase-pin/change",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        currentPin,
                        newPin
                    })
                }
            );

            const data =
                await response.json();

            if (!data.success) {
                showMessage(
                    data.message,
                    "error"
                );

                button.disabled = false;
                button.textContent =
                    "Change Purchase PIN";

                return;
            }

            showMessage(
                "Purchase PIN changed successfully!",
                "success"
            );

            document.getElementById("currentPin").value = "";
            document.getElementById("changeNewPin").value = "";
            document.getElementById("changeConfirmPin").value = "";

        } catch (error) {

            console.error(error);

            showMessage(
                "Something went wrong. Please try again.",
                "error"
            );

            button.disabled = false;
            button.textContent =
                "Change Purchase PIN";
        }
    }

    function logout() {

        localStorage.removeItem("cheapdataUser");

        window.location.href = "login.html";
    }

    loadUser();

</script>

</body>
</html>
