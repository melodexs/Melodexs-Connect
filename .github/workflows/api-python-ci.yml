name: Python API CI

# Continuous verification for apps/api-python (the Python replacement
# backend). Runs the full automated test suite on every pull request
# that touches the Python backend, and on pushes to master.
#
# The 7 PostgreSQL integration tests are intentionally opt-in: they run
# only when the caller provides validated PostgreSQL connection
# settings via the environment gate in tests/conftest.py. CI therefore
# reports them as skipped, and the whitespace/leak guards below keep
# the run honest.

on:
  pull_request:
    paths:
      - "apps/api-python/**"
      - ".github/workflows/api-python-ci.yml"
  push:
    branches:
      - master
    paths:
      - "apps/api-python/**"
      - ".github/workflows/api-python-ci.yml"

permissions:
  contents: read

jobs:
  tests:
    name: Automated test suite (scratch SQLite)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api-python
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api-python/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests against an external scratch database
        env:
          NODE_ENV: test
          PYTHON_TEST_DATABASE_URL: sqlite:////tmp/mcx-ci-tests.db
        run: python3 -m pytest tests/ -q

      - name: Guard against test databases left inside the repository
        run: |
          if ls tests/*.db >/dev/null 2>&1; then
            echo "::error::test run left a database file inside the repository"
            ls -la tests/*.db
            exit 1
          fi
          echo "No test database files inside the repository."

  whitespace:
    name: Whitespace check (git diff --check)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff for whitespace errors
        if: github.event_name == 'pull_request'
        run: git diff --check "$(git merge-base origin/master HEAD)"

      - name: Check tip commit for whitespace errors
        if: github.event_name == 'push'
        run: git diff --check HEAD~1
