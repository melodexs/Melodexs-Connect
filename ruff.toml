# Deliberately narrow: this project has no auto-formatter and a large existing
# codebase, so only correctness rules run. Style is reviewed by humans.
line-length = 120
target-version = "py311"

[lint]
select = ["E9", "F63", "F7", "F82"]
# E9  syntax errors        F63 invalid escape sequences
# F7  undefined names in expressions   F82 undefined names in __all__
